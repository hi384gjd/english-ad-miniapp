<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>قسم الممثلين</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

:root{

    --bg:#070707;
    --surface:#101010;
    --card:#151515;

    --white:#fff;
    --text:#f4f4f4;
    --muted:#777;

    --red:#e50914;
    --pink:#ff245f;

    --border:rgba(255,255,255,.08);

}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

html{

    scroll-behavior:smooth;

}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(229,9,20,.14),
            transparent 35%
        ),
        var(--bg);

    color:var(--text);

    font-family:'Cairo',sans-serif;

    overflow-x:hidden;

}

button,
input{

    font-family:inherit;

}

.container{

    width:min(1180px,94%);

    margin:auto;

}


/* =========================================================
   الأيقونة العلوية
========================================================= */

.topbar{

    height:60px;

    display:flex;
    align-items:center;
    justify-content:center;

}

.topbar-icon{

    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #ff1b36,
            #b9000b
        );

    color:white;

    font-size:15px;

    box-shadow:
        0 10px 35px
        rgba(229,9,20,.28);

}


/* =========================================================
   البنر 4:3
========================================================= */

.hero{

    position:relative;

    width:100%;

    aspect-ratio:4 / 3;

    max-height:600px;

    overflow:hidden;

    border-radius:24px;

    border:1px solid var(--border);

    background:#111;

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.55);

}

.hero-media{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

}

.hero::before{

    content:"";

    position:absolute;

    inset:0;

    z-index:1;

    background:

        linear-gradient(
            90deg,
            rgba(0,0,0,.94) 0%,
            rgba(0,0,0,.58) 45%,
            rgba(0,0,0,.12) 100%
        );

}

.hero::after{

    content:"";

    position:absolute;

    inset:0;

    z-index:2;

    background:

        linear-gradient(
            to top,
            rgba(0,0,0,.96),
            transparent 58%
        );

}


/* =========================================================
   محتوى البنر
========================================================= */

.hero-content{

    position:absolute;

    inset:0;

    z-index:5;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:flex-start;

    padding:50px;

}

.hero-small{

    display:flex;

    align-items:center;

    gap:8px;

    color:#ddd;

    font-size:11px;

    font-weight:800;

    margin-bottom:12px;

}

.hero-small i{

    color:var(--red);

    font-size:8px;

}

.hero-title{

    max-width:600px;

    color:white;

    font-size:44px;

    line-height:1.2;

    font-weight:900;

}

.hero-text{

    max-width:520px;

    margin-top:14px;

    color:#c0c0c0;

    font-size:12px;

    line-height:2;

}


/* =========================================================
   زر شاهد الآن — البنر فقط
========================================================= */

.hero-watch{

    margin-top:23px;

    height:49px;

    min-width:145px;

    padding:0 23px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            var(--red),
            var(--pink)
        );

    color:white;

    text-decoration:none;

    font-size:11px;

    font-weight:900;

    box-shadow:
        0 12px 30px
        rgba(229,9,20,.22);

    transition:.25s;

}

.hero-watch:hover{

    transform:translateY(-3px);

    box-shadow:
        0 18px 40px
        rgba(229,9,20,.32);

}


/* =========================================================
   القسم
========================================================= */

.section-area{

    padding:
        40px 0 80px;

}

.section-header{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:20px;

    margin-bottom:20px;

}

.section-title-box{

    display:flex;

    flex-direction:column;

    gap:5px;

}

.section-kicker{

    color:var(--red);

    font-size:10px;

    font-weight:900;

}

.section-title{

    font-size:30px;

    line-height:1.3;

    font-weight:900;

}

.section-subtitle{

    color:#707070;

    font-size:10px;

}

.counter{

    padding:8px 13px;

    border-radius:10px;

    background:#121212;

    border:1px solid var(--border);

    color:#999;

    font-size:9px;

    white-space:nowrap;

}


/* =========================================================
   البحث
========================================================= */

.search-area{

    margin-bottom:30px;

}

.search-box{

    position:relative;

    height:60px;

    display:flex;

    align-items:center;

    background:
        linear-gradient(
            135deg,
            #171717,
            #101010
        );

    border:1px solid #292929;

    border-radius:15px;

    transition:.25s;

}

.search-box:focus-within{

    border-color:
        rgba(229,9,20,.65);

    box-shadow:
        0 0 0 4px
        rgba(229,9,20,.06);

}

.search-icon{

    width:58px;

    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#777;

    font-size:16px;

    flex-shrink:0;

}

.search-box:focus-within
.search-icon{

    color:var(--red);

}

.search-input{

    width:100%;
    height:100%;

    border:0;
    outline:0;

    background:transparent;

    color:white;

    font-size:13px;

    padding-left:15px;

}

.search-input::placeholder{

    color:#666;

}

.search-clear{

    width:34px;
    height:34px;

    margin-left:8px;
    margin-right:7px;

    display:none;

    align-items:center;
    justify-content:center;

    border:0;

    border-radius:9px;

    background:#252525;

    color:#888;

    cursor:pointer;

}

.search-clear.show{

    display:flex;

}

.search-clear:hover{

    color:white;

    background:var(--red);

}

.search-hint{

    margin-top:9px;

    color:#555;

    font-size:9px;

}


/* =========================================================
   شبكة الممثلين
========================================================= */

.actors-grid{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:20px;

}


/* =========================================================
   بطاقة الممثل
========================================================= */

.actor-card{

    position:relative;

    overflow:hidden;

    border-radius:20px;

    background:
        linear-gradient(
            180deg,
            #181818,
            #101010
        );

    border:1px solid #292929;

    cursor:pointer;

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;

}

.actor-card:hover{

    transform:translateY(-7px);

    border-color:#454545;

    box-shadow:
        0 25px 60px
        rgba(0,0,0,.55);

}


/* =========================================================
   صورة الممثل
========================================================= */

.actor-image{

    position:relative;

    width:100%;

    aspect-ratio:4 / 5.3;

    overflow:hidden;

    background:#0c0c0c;

}

.actor-image img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:
        transform .6s ease;

}

.actor-card:hover
.actor-image img{

    transform:scale(1.07);

}

.actor-image::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            transparent 45%,
            rgba(0,0,0,.15) 60%,
            rgba(0,0,0,.92) 100%
        );

}


/* =========================================================
   مميز
========================================================= */

.featured{

    position:absolute;

    z-index:4;

    top:13px;

    right:13px;

    padding:7px 10px;

    display:flex;

    align-items:center;

    gap:6px;

    border-radius:9px;

    background:
        rgba(0,0,0,.68);

    backdrop-filter:blur(12px);

    border:1px solid
        rgba(255,255,255,.1);

    color:white;

    font-size:8px;

    font-weight:800;

}

.featured i{

    color:#ffc43b;

}


/* =========================================================
   زر السهم
========================================================= */

.profile-arrow{

    position:absolute;

    z-index:4;

    left:14px;

    bottom:14px;

    width:42px;
    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:white;

    color:#111;

    font-size:12px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.4);

}


/* =========================================================
   اسم الممثل فقط
========================================================= */

.actor-content{

    padding:
        18px 17px 19px;

}

.actor-name{

    color:white;

    font-size:20px;

    line-height:1.4;

    font-weight:900;

}

.actor-name-en{

    margin-top:3px;

    color:#707070;

    direction:ltr;

    text-align:right;

    font-size:10px;

    font-weight:600;

}


/* =========================================================
   الخط السفلي
========================================================= */

.actor-line{

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--red),
            transparent
        );

    opacity:.55;

}


/* =========================================================
   لا توجد نتائج
========================================================= */

.no-results{

    display:none;

    padding:70px 20px;

    text-align:center;

}

.no-results.show{

    display:block;

}

.no-results-icon{

    width:72px;
    height:72px;

    margin:auto;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#131313;

    border:1px solid #292929;

    color:#444;

    font-size:23px;

}

.no-results p{

    margin-top:14px;

    color:#666;

    font-size:11px;

}


/* =========================================================
   تحميل المزيد
========================================================= */

.load-more{

    margin-top:32px;

    display:flex;

    justify-content:center;

}

.load-more button{

    height:46px;

    padding:0 27px;

    border:1px solid #303030;

    border-radius:12px;

    background:#151515;

    color:#bbb;

    font-size:10px;

    font-weight:800;

    cursor:pointer;

    transition:.25s;

}

.load-more button:hover{

    background:#222;

    color:white;

}

.load-more i{

    color:var(--red);

    margin-left:7px;

}


/* =========================================================
   MODAL
========================================================= */

.modal{

    position:fixed;

    inset:0;

    z-index:5000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;

    background:
        rgba(0,0,0,.9);

    backdrop-filter:blur(18px);

}

.modal.active{

    display:flex;

}

.modal-box{

    position:relative;

    width:min(500px,100%);

    max-height:90vh;

    overflow:auto;

    padding:26px;

    border-radius:22px;

    background:
        linear-gradient(
            180deg,
            #1c1c1c,
            #101010
        );

    border:1px solid #363636;

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.8);

    animation:
        modalIn .25s ease;

}

@keyframes modalIn{

    from{

        opacity:0;

        transform:
            translateY(15px)
            scale(.94);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}

.close-modal{

    position:absolute;

    top:12px;
    left:12px;

    width:36px;
    height:36px;

    border:0;

    border-radius:50%;

    background:#292929;

    color:#ddd;

    cursor:pointer;

    z-index:5;

}

.close-modal:hover{

    background:var(--red);

}

.modal-photo{

    width:120px;
    height:150px;

    display:block;

    margin:0 auto 16px;

    object-fit:cover;

    border-radius:15px;

    border:1px solid #363636;

}

.modal-name{

    text-align:center;

    font-size:24px;

    font-weight:900;

}

.modal-en{

    margin-top:2px;

    color:#777;

    text-align:center;

    direction:ltr;

    font-size:10px;

}

.info-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;

    margin-top:20px;

}

.info-box{

    padding:13px;

    border-radius:11px;

    background:#191919;

    border:1px solid #292929;

}

.info-label{

    color:#666;

    font-size:8px;

}

.info-value{

    margin-top:4px;

    color:#eee;

    font-size:10px;

    font-weight:800;

}

.modal-watch{

    width:100%;

    height:49px;

    margin-top:17px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            var(--red),
            var(--pink)
        );

    color:white;

    text-decoration:none;

    font-size:11px;

    font-weight:900;

}


/* =========================================================
   الهاتف
========================================================= */

@media(max-width:700px){

    .topbar{

        height:53px;

    }

    .topbar-icon{

        width:35px;
        height:35px;

        border-radius:11px;

        font-size:13px;

    }

    .container{

        width:94%;

    }

    .hero{

        aspect-ratio:4 / 3;

        border-radius:18px;

    }

    .hero::before{

        background:

            linear-gradient(
                to top,
                rgba(0,0,0,.98) 0%,
                rgba(0,0,0,.62) 48%,
                rgba(0,0,0,.08) 100%
            );

    }

    .hero-content{

        padding:23px;

        justify-content:flex-end;

    }

    .hero-small{

        font-size:8px;

        margin-bottom:7px;

    }

    .hero-title{

        font-size:27px;

    }

    .hero-text{

        margin-top:7px;

        font-size:9px;

        line-height:1.8;

    }

    .hero-watch{

        height:41px;

        min-width:125px;

        margin-top:13px;

        padding:0 17px;

        font-size:9px;

    }

    .section-area{

        padding:
            29px 0 60px;

    }

    .section-header{

        margin-bottom:16px;

    }

    .section-kicker{

        font-size:8px;

    }

    .section-title{

        font-size:23px;

    }

    .section-subtitle{

        font-size:8px;

    }

    .counter{

        padding:6px 9px;

        font-size:7px;

    }

    .search-box{

        height:52px;

        border-radius:13px;

    }

    .search-icon{

        width:47px;

        font-size:13px;

    }

    .search-input{

        font-size:11px;

    }

    .search-hint{

        font-size:8px;

    }

    .actors-grid{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:11px;

    }

    .actor-card{

        border-radius:15px;

    }

    .actor-image{

        aspect-ratio:3 / 4;

    }

    .featured{

        top:8px;
        right:8px;

        padding:5px 7px;

        font-size:6px;

    }

    .profile-arrow{

        width:32px;
        height:32px;

        left:8px;
        bottom:8px;

        font-size:9px;

    }

    .actor-content{

        padding:
            12px 10px 13px;

    }

    .actor-name{

        font-size:14px;

    }

    .actor-name-en{

        font-size:7px;

    }

    .modal-box{

        padding:21px;

        border-radius:18px;

    }

    .modal-name{

        font-size:20px;

    }

}

@media(max-width:360px){

    .hero-title{

        font-size:24px;

    }

    .actor-name{

        font-size:12px;

    }

}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{

    width:5px;

}

::-webkit-scrollbar-track{

    background:#070707;

}

::-webkit-scrollbar-thumb{

    background:#303030;

    border-radius:20px;

}

</style>

</head>

/* =========================================================
   عناصر الصفحة
========================================================= */

const grid =
    document.getElementById("actorsGrid");

const searchInput =
    document.getElementById("searchInput");

const searchClear =
    document.getElementById("searchClear");

const counter =
    document.getElementById("counter");

const noResults =
    document.getElementById("noResults");

const loadMore =
    document.getElementById("loadMore");

const modal =
    document.getElementById("modal");

const modalContent =
    document.getElementById("modalContent");

const closeModal =
    document.getElementById("closeModal");


/* =========================================================
   إعداد العرض
========================================================= */

const PER_PAGE = 20;

let visible =
    PER_PAGE;


/* =========================================================
   تطبيع البحث العربي
========================================================= */

function normalizeArabic(text){

    return String(text || "")

        .toLowerCase()

        .replace(
            /[\u064B-\u065F\u0670]/g,
            ""
        )

        .replace(
            /[أإآٱ]/g,
            "ا"
        )

        .replace(
            /ى/g,
            "ي"
        )

        .replace(
            /ة/g,
            "ه"
        )

        .replace(
            /ؤ/g,
            "و"
        )

        .replace(
            /ئ/g,
            "ي"
        )

        .replace(
            /ـ/g,
            ""
        )

        .replace(
            /[^\p{L}\p{N}\s]/gu,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =========================================================
   إنشاء بدائل البحث
========================================================= */

function createSearchVariants(text){

    const normalized =
        normalizeArabic(text);


    const variants =
        new Set();


    variants.add(
        normalized
    );


    variants.add(
        normalized.replace(
            /ه/g,
            "ة"
        )
    );


    variants.add(
        normalized.replace(
            /ة/g,
            "ه"
        )
    );


    variants.add(
        normalized.replace(
            /ي/g,
            "ى"
        )
    );


    return [
        ...variants
    ];

}


/* =========================================================
   البحث الذكي
========================================================= */

function smartMatch(actor,query){

    const queryVariants =
        createSearchVariants(query);


    /*
       البحث داخل اسم الممثل
       والاسم الإنجليزي والبلد والمجال فقط
    */

    const actorText = [

        actor.name,
        actor.english,
        actor.country,
        actor.profession

    ]
    .map(
        item =>
            normalizeArabic(item)
    )
    .join(" ");


    const actorVariants =
        createSearchVariants(actorText);


    return queryVariants.some(
        queryVariant => {

            const words =
                queryVariant
                .split(" ")
                .filter(Boolean);


            return actorVariants.some(
                actorVariant => {

                    return words.every(
                        word =>
                            actorVariant.includes(word)
                    );

                }
            );

        }
    );

}


/* =========================================================
   النتائج
========================================================= */

function getResults(){

    const query =
        searchInput.value.trim();


    if(!query){

        return actors;

    }


    return actors.filter(
        actor =>
            smartMatch(
                actor,
                query
            )
    );

}


/* =========================================================
   حماية HTML
========================================================= */

function escapeHTML(value){

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   رسم البطاقات
========================================================= */

function render(){

    const results =
        getResults();


    grid.innerHTML = "";


    results
    .slice(0,visible)
    .forEach(
        actor => {


        const card =
            document.createElement("article");


        card.className =
            "actor-card";


        card.innerHTML = `

            <div class="actor-image">

                <img
                    src="${escapeHTML(actor.image)}"
                    alt="${escapeHTML(actor.name)}"
                    loading="lazy"
                    decoding="async"
                >


                ${
                    actor.featured
                    ?
                    `
                    <div class="featured">

                        <i class="fa-solid fa-star"></i>

                        مميز

                    </div>
                    `
                    :
                    ""
                }


                <div class="profile-arrow">

                    <i class="fa-solid fa-arrow-left"></i>

                </div>

            </div>


            <div class="actor-content">


                <div class="actor-name">

                    ${escapeHTML(actor.name)}

                </div>


                <div class="actor-name-en">

                    ${escapeHTML(actor.english)}

                </div>


            </div>


            <div class="actor-line"></div>

        `;


        card.addEventListener(
            "click",
            () =>
                openActor(actor)
        );


        grid.appendChild(card);

    });


    counter.textContent =
        `${results.length} شخصية`;


    if(results.length === 0){

        noResults.classList.add(
            "show"
        );

    }else{

        noResults.classList.remove(
            "show"
        );

    }


    if(
        visible <
        results.length
    ){

        loadMore.style.display =
            "flex";

    }else{

        loadMore.style.display =
            "none";

    }

}


/* =========================================================
   البحث
========================================================= */

searchInput.addEventListener(
    "input",
    function(){

        visible =
            PER_PAGE;


        if(
            this.value.trim()
        ){

            searchClear.classList.add(
                "show"
            );

        }else{

            searchClear.classList.remove(
                "show"
            );

        }


        render();

    }
);


/* =========================================================
   مسح البحث
========================================================= */

searchClear.addEventListener(
    "click",
    function(){

        searchInput.value = "";

        searchClear.classList.remove(
            "show"
        );

        visible =
            PER_PAGE;

        render();

        searchInput.focus();

    }
);


/* =========================================================
   المزيد
========================================================= */

loadMore.addEventListener(
    "click",
    function(){

        visible +=
            PER_PAGE;

        render();

    }
);


/* =========================================================
   فتح ملف الممثل
========================================================= */

function openActor(actor){

    modalContent.innerHTML = `

        <img
            class="modal-photo"
            src="${escapeHTML(actor.image)}"
            alt="${escapeHTML(actor.name)}"
        >


        <div class="modal-name">

            ${escapeHTML(actor.name)}

        </div>


        <div class="modal-en">

            ${escapeHTML(actor.english)}

        </div>


        <div class="info-grid">


            <div class="info-box">

                <div class="info-label">

                    تاريخ الميلاد

                </div>

                <div class="info-value">

                    ${escapeHTML(actor.birth)}

                </div>

            </div>


            <div class="info-box">

                <div class="info-label">

                    البلد

                </div>

                <div class="info-value">

                    ${escapeHTML(actor.country)}

                </div>

            </div>


            <div class="info-box">

                <div class="info-label">

                    المجال

                </div>

                <div class="info-value">

                    ${escapeHTML(actor.profession)}

                </div>

            </div>


            <div class="info-box">

                <div class="info-label">

                    التقييم

                </div>

                <div class="info-value">

                    ⭐ ${actor.rating}%

                </div>

            </div>


        </div>


        <a
            href="${escapeHTML(actor.link)}"
            class="modal-watch"
            target="_blank"
            rel="noopener noreferrer"
        >

            <i class="fa-solid fa-play"></i>

            شاهد الآن

        </a>

    `;


    modal.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   إغلاق
========================================================= */

function closeActor(){

    modal.classList.remove(
        "active"
    );


    document.body.style.overflow =
        "";

}


closeModal.addEventListener(
    "click",
    closeActor
);


modal.addEventListener(
    "click",
    function(event){

        if(
            event.target === modal
        ){

            closeActor();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeActor();

        }

    }
);


/* =========================================================
   تشغيل
========================================================= */

render();

</script>
