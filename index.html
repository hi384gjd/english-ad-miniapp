<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DULINGO</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- AdsGram -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .heart {
            font-size: 65px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        p {
            color: #aaa;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .ad-button {
            width: 100%;
            border: 0;
            border-radius: 16px;
            padding: 18px;
            background: #e50914;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .ad-button:active {
            transform: scale(0.98);
        }

        .ad-button:disabled {
            opacity: 0.6;
        }

        .status {
            margin-top: 25px;
            color: #777;
            font-size: 14px;
            min-height: 22px;
        }

        .success {
            color: #35d07f;
        }

        .error {
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="heart">❤️</div>

    <h1>احصل على قلب</h1>

    <p>
        شاهد الإعلان حتى النهاية<br>
        واحصل على قلب إضافي ❤️
    </p>

    <button class="ad-button" id="adButton">
        ▶️ شاهد الإعلان
    </button>

    <div class="status" id="status">
        اضغط على الزر لبدء الإعلان
    </div>

</div>

<script>

    // رقم إعلان AdsGram
    const BLOCK_ID = "50140";

    // تهيئة AdsGram
    const AdController = window.Adsgram.init({
        blockId: BLOCK_ID
    });

    const button = document.getElementById("adButton");
    const status = document.getElementById("status");

    button.addEventListener("click", async function () {

        button.disabled = true;

        status.className = "status";
        status.textContent = "⏳ جاري تحميل الإعلان...";

        try {

            const result = await AdController.show();

            // الإعلان اكتمل
            status.className = "status success";
            status.textContent = "🎉 أحسنت! حصلت على قلب ❤️";

        } catch (error) {

            status.className = "status error";
            status.textContent = "❌ لم يكتمل الإعلان، حاول مرة ثانية.";

            console.log("AdsGram Error:", error);

        } finally {

            button.disabled = false;

        }

    });

</script>

</body>
</html>
