<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مسلسلات وافلام</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#080c11;
    --header:#0d131a;
    --card:#111820;
    --card-hover:#18212c;
    --text:#fff;
    --muted:#9299a3;
    --accent:#229ED9;
    --border:#202b37;
    --badge:rgba(0,0,0,.78);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(
            circle at top right,
            rgba(34,158,217,.08),
            transparent 30%
        ),
        var(--bg);

    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;

    user-select:none;
    -webkit-user-select:none;
}

input{
    user-select:text;
    -webkit-user-select:text;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    position:sticky;
    top:0;
    z-index:100;

    min-height:58px;

    padding:8px 12px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(13,19,26,.97);

    border-bottom:1px solid var(--border);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.header-title{
    font-size:16px;
    font-weight:800;
    white-space:nowrap;
}

.header-sub{
    display:block;
    margin-top:0;

    color:var(--muted);

    font-size:8px;
    font-weight:500;
}

.request-btn{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:4px;

    padding:7px 9px;

    border:0;
    outline:0;

    border-radius:9px;

    background:var(--accent);
    color:#fff;

    font-size:10px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 5px 18px rgba(34,158,217,.16);

    transition:.2s;
}

.request-btn:active{
    transform:scale(.94);
}

.telegram-icon{
    width:15px;
    height:15px;
    fill:#fff;
}


/* =====================================================
   SEARCH
===================================================== */

.search-box{
    position:sticky;
    top:58px;
    z-index:90;

    padding:8px 12px;

    background:rgba(13,19,26,.95);

    border-bottom:1px solid var(--border);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.search-wrapper{
    position:relative;
}

.search-icon{
    position:absolute;

    right:11px;
    top:50%;

    transform:translateY(-50%);

    color:var(--muted);

    font-size:15px;

    pointer-events:none;
}

.search-box input{
    width:100%;
    height:39px;

    padding:0 12px;
    padding-right:36px;

    border-radius:10px;

    border:1px solid var(--border);

    background:#080d13;

    color:#fff;

    outline:none;

    font-size:11px;

    transition:.2s;
}

.search-box input:focus{
    border-color:var(--accent);

    box-shadow:
        0 0 0 3px rgba(34,158,217,.08);
}

.search-box input::placeholder{
    color:#6f7883;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:100%;
    max-width:1200px;

    margin:auto;

    padding:
        11px 0 25px;
}


/* =====================================================
   SECTION
===================================================== */

.content-section{
    margin-bottom:17px;
}

.section-header{
    display:flex;
    align-items:center;

    padding:0 12px;

    margin-bottom:7px;
}

.section-name{
    display:flex;
    align-items:center;

    gap:6px;

    flex-shrink:0;

    font-size:15px;
    font-weight:800;
}

.section-icon{
    width:28px;
    height:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:
        rgba(34,158,217,.12);

    border:
        1px solid rgba(34,158,217,.18);

    font-size:14px;
}

.section-line{
    flex:1;

    height:1px;

    margin-right:8px;

    background:
        linear-gradient(
            to left,
            transparent,
            var(--border)
        );
}

.section-count{
    color:var(--muted);

    font-size:8px;

    white-space:nowrap;
}


/* =====================================================
   HORIZONTAL ROW
===================================================== */

.grid{
    display:flex;

    flex-direction:row;

    direction:rtl;

    gap:7px;

    overflow-x:auto;
    overflow-y:hidden;

    padding:
        2px 12px 7px;

    scroll-snap-type:x mandatory;

    -webkit-overflow-scrolling:touch;

    scrollbar-width:none;

    overscroll-behavior-x:contain;
}

.grid::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   CARD
===================================================== */

.card{
    position:relative;

    flex:0 0 118px;

    width:118px;
    min-width:118px;

    overflow:hidden;

    border-radius:10px;

    background:var(--card);

    border:1px solid var(--border);

    cursor:pointer;

    scroll-snap-align:start;

    transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease;

    animation:
        cardIn .3s ease both;
}

.card:hover{
    transform:translateY(-2px);

    background:var(--card-hover);

    border-color:#2c3a48;
}

.card:active{
    transform:scale(.96);
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:translateY(7px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =====================================================
   POSTER
===================================================== */

.poster{
    position:relative;

    overflow:hidden;

    background:#0c1117;
}

.poster img{
    display:block;

    width:100%;
    height:180px;

    object-fit:cover;

    transition:
        transform .35s ease;
}

.card:hover .poster img{
    transform:scale(1.04);
}

.poster::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:30%;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.55)
        );

    pointer-events:none;
}


/* =====================================================
   YEAR
===================================================== */

.year-badge{
    position:absolute;

    z-index:3;

    right:5px;
    bottom:5px;

    padding:2px 5px;

    background:var(--badge);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:5px;

    font-size:7px;

    font-weight:700;

    backdrop-filter:blur(5px);
}


/* =====================================================
   CARD INFO
===================================================== */

.card-info{
    display:flex;

    align-items:center;

    min-height:47px;

    padding:6px;
}

.text-container{
    width:100%;
    min-width:0;

    overflow:hidden;

    display:flex;
    flex-direction:column;

    gap:1px;
}

.card-title{
    font-size:9px;

    font-weight:700;

    line-height:1.5;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.channel-info{
    font-size:7px;

    color:var(--muted);

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =====================================================
   MORE CARD
===================================================== */

.more-card{
    position:relative;

    flex:0 0 118px;

    width:118px;
    min-width:118px;

    height:217px;
    min-height:217px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:8px;

    border-radius:10px;

    background:
        linear-gradient(
            130deg,
            #121b24,
            #0d141c
        );

    border:
        1px solid
        #263441;

    cursor:pointer;

    scroll-snap-align:start;

    transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease;
}

.more-card:hover{
    transform:translateY(-2px);

    border-color:var(--accent);

    background:
        linear-gradient(
            145deg,
            #162532,
            #0d141c
        );
}

.more-card:active{
    transform:scale(.95);
}

.more-icon{
    width:43px;
    height:43px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        rgba(34,158,217,.12);

    border:
        1px solid
        rgba(34,158,217,.35);

    color:var(--accent);

    font-size:21px;

    box-shadow:
        0 0 20px
        rgba(34,158,217,.08);
}

.more-title{
    font-size:12px;

    font-weight:800;

    color:#fff;
}

.more-sub{
    color:var(--muted);

    font-size:7px;

    text-align:center;

    padding:0 8px;
}

.more-arrow{
    color:var(--accent);

    font-size:17px;

    line-height:1;

    transition:.2s;
}

.more-card:hover .more-arrow{
    transform:translateX(-4px);
}


/* =====================================================
   NO RESULTS
===================================================== */

.no-results{
    display:none;

    padding:40px 15px;

    text-align:center;

    color:var(--muted);
}

.no-results-icon{
    font-size:30px;

    margin-bottom:7px;
}

.no-results-text{
    font-size:11px;
}


/* =====================================================
   TABLET
===================================================== */

@media(min-width:600px){

    .card,
    .more-card{
        flex-basis:135px;
        width:135px;
        min-width:135px;
    }

    .poster img{
        height:195px;
    }

    .more-card{
        height:242px;
        min-height:242px;
    }

    .card-title{
        font-size:10px;
    }

    .channel-info{
        font-size:8px;
    }

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:950px){

    .card,
    .more-card{
        flex-basis:150px;
        width:150px;
        min-width:150px;
    }

    .poster img{
        height:215px;
    }

    .more-card{
        height:262px;
        min-height:262px;
    }

}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar{
    width:4px;
}

::-webkit-scrollbar-track{
    background:#080c11;
}

::-webkit-scrollbar-thumb{
    background:#263340;
    border-radius:10px;
}

</style>
</head>


<body>


<header class="header">

    <div>

        <div class="header-title">
            مسلسلات وأفلام
        </div>

        <span class="header-sub">
            أحدث الإضافات والمحتوى
        </span>

    </div>


    <button
        class="request-btn"
        onclick="requestSeries()"
    >

        <svg
            class="telegram-icon"
            viewBox="0 0 24 24"
        >

            <path d="M9.04 15.47l-.39 5.49c.56 0 .81-.24 1.11-.53l2.66-2.54 5.51 4.03c1.01.56 1.73.27 1.98-.93l3.59-16.84.01-.01c.3-1.38-.5-1.92-1.49-1.55L1.64 9.33c-1.34.52-1.32 1.27-.23 1.61l5.59 1.75L19.02 5.2c.56-.34 1.07-.15.65.19"/>

        </svg>

        طلب مسلسل/فيلم

    </button>

</header>


<div class="search-box">

    <div class="search-wrapper">

        <span class="search-icon">
            ⌕
        </span>

        <input
            type="text"
            id="searchInput"
            placeholder="ابحث عن فيلم أو مسلسل..."
            autocomplete="off"
        >

    </div>

</div>


<main class="container">


    <!-- الأفلام -->

    <section class="content-section">

        <div class="section-header">

            <div class="section-name">

                <div class="section-icon">
                    🎬
                </div>

                <span>
                    الأفلام
                </span>

            </div>

            <div class="section-line"></div>

            <div
                class="section-count"
                id="moviesCount"
            >
                0 فيلم
            </div>

        </div>


        <div
            class="grid"
            id="moviesResults"
        ></div>

    </section>


    <!-- المسلسلات -->

    <section class="content-section">

        <div class="section-header">

            <div class="section-name">

                <div class="section-icon">
                    📺
                </div>

                <span>
                    المسلسلات
                </span>

            </div>

            <div class="section-line"></div>

            <div
                class="section-count"
                id="seriesCount"
            >
                0 مسلسل
            </div>

        </div>


        <div
            class="grid"
            id="seriesResults"
        ></div>

    </section>


    <div
        class="no-results"
        id="noResults"
    >

        <div class="no-results-icon">
            🔎
        </div>

        <div class="no-results-text">
            لا توجد نتائج مطابقة لبحثك
        </div>

    </div>

</main>



<script>

const TELEGRAM_URL =
    "https://t.me/ab6_ab6";

const ITEMS_PER_PAGE = 12;


/* =====================================================
   REQUEST
===================================================== */

function requestSeries(){

    window.open(
        TELEGRAM_URL,
        "_blank"
    );

}


/* =====================================================
   TIME
===================================================== */

function timeAgoArabic(dateString){

    



}


/* =====================================================
   IMAGE ERROR
===================================================== */

function imageError(img){

    img.onerror = null;

    img.src =
        "https://ui-avatars.com/api/?name=No+Image&background=111820&color=fff&size=600";

}


/* =====================================================
   MOVIES
===================================================== */

const movies = [

    {
    title: "Fresh",
    year: "2022",
    img: "https://j.top4top.io/p_3922ynukq0.jpg",
    url: "https://nexuslnvi.com/s/2104258804400164865",
    timestamp: "2026-08-10T12:00:00+03:00",
    search: [
        "Fresh",
        "fresh 2022",
        "فريش",
        "فيلم فريش",
        "فريش 2022"
    ]
},

    
];


/* =====================================================
   SERIES
===================================================== */

const series = [

    {
        title:"A Small Light",
        year:"2023",
        img:"https://l.top4top.io/p_392211odq0.jpg",
        url:"https://nexusjdes.com/s/2104208158506512386",
        search:[
            "A Small Light",
            "a small light",
            "ضوء صغير",
            "ضوء صغير 2023",
            "مسلسل ضوء صغير"
        ]
    }

];


/* =====================================================
   DATA
===================================================== */

let filteredMovies = [...movies];

let filteredSeries = [...series];

let movieVisible = ITEMS_PER_PAGE;

let seriesVisible = ITEMS_PER_PAGE;


/* =====================================================
   CARD
===================================================== */

function createCard(item){

    const card =
        document.createElement("div");

    card.className = "card";


    card.onclick = function(){

        if(
            item.url &&
            item.url !== "#"
        ){

            window.open(
                item.url,
                "_blank"
            );

        }

    };


    card.innerHTML = `

        <div class="poster">

            <img
                src="${item.img}"
                alt="${item.title}"
                loading="lazy"
                onerror="imageError(this)"
            >

            <div class="year-badge">
                ${item.year || "—"}
            </div>

        </div>


        <div class="card-info">

            <div class="text-container">

                <div class="card-title">
                    ${item.title}
                </div>

                <div class="channel-info">

                

                    •

                    ${timeAgoArabic(item.timestamp)}

                </div>

            </div>

        </div>

    `;


    return card;

}


/* =====================================================
   MORE
===================================================== */

function createMoreCard(type){

    const card =
        document.createElement("div");

    card.className =
        "more-card";


    card.innerHTML = `

        <div class="more-icon">
            +
        </div>

        <div class="more-title">
            المزيد
        </div>

        <div class="more-sub">
            عرض المزيد من المحتوى
        </div>

        <div class="more-arrow">
            ←
        </div>

    `;


    card.onclick = function(){

        if(type === "movie"){

            movieVisible += ITEMS_PER_PAGE;

            renderMovies(true);

        }else{

            seriesVisible += ITEMS_PER_PAGE;

            renderSeries(true);

        }

    };


    return card;

}


/* =====================================================
   MOVIES RENDER
===================================================== */

function renderMovies(keepPosition=false){

    const container =
        document.getElementById(
            "moviesResults"
        );

    const oldScroll =
        container.scrollLeft;

    container.innerHTML = "";


    const items =
        filteredMovies.slice(
            0,
            movieVisible
        );


    items.forEach(
        item => {

            container.appendChild(
                createCard(item)
            );

        }
    );


    if(
        movieVisible <
        filteredMovies.length
    ){

        container.appendChild(
            createMoreCard("movie")
        );

    }


    document.getElementById(
        "moviesCount"
    ).innerText =
        `${filteredMovies.length} فيلم`;


    if(keepPosition){

        container.scrollLeft =
            oldScroll;

    }

}


/* =====================================================
   SERIES RENDER
===================================================== */

function renderSeries(keepPosition=false){

    const container =
        document.getElementById(
            "seriesResults"
        );

    const oldScroll =
        container.scrollLeft;

    container.innerHTML = "";


    const items =
        filteredSeries.slice(
            0,
            seriesVisible
        );


    items.forEach(
        item => {

            container.appendChild(
                createCard(item)
            );

        }
    );


    if(
        seriesVisible <
        filteredSeries.length
    ){

        container.appendChild(
            createMoreCard("series")
        );

    }


    document.getElementById(
        "seriesCount"
    ).innerText =
        `${filteredSeries.length} مسلسل`;


    if(keepPosition){

        container.scrollLeft =
            oldScroll;

    }

}


/* =====================================================
   SEARCH
===================================================== */

document
.getElementById("searchInput")
.addEventListener(
    "input",
    function(){

        const value =
            this.value
            .trim()
            .toLowerCase();


        filteredMovies =
            movies.filter(
                item => {

                    const titleMatch =
                        item.title
                        .toLowerCase()
                        .includes(value);


                    const searchMatch =
                        item.search &&
                        item.search.some(
                            word =>
                            word
                            .toLowerCase()
                            .includes(value)
                        );


                    return (
                        titleMatch ||
                        searchMatch
                    );

                }
            );


        filteredSeries =
            series.filter(
                item => {

                    const titleMatch =
                        item.title
                        .toLowerCase()
                        .includes(value);


                    const searchMatch =
                        item.search &&
                        item.search.some(
                            word =>
                            word
                            .toLowerCase()
                            .includes(value)
                        );


                    return (
                        titleMatch ||
                        searchMatch
                    );

                }
            );


        movieVisible =
            ITEMS_PER_PAGE;

        seriesVisible =
            ITEMS_PER_PAGE;


        renderMovies();

        renderSeries();


        const total =
            filteredMovies.length +
            filteredSeries.length;


        document.getElementById(
            "noResults"
        ).style.display =
            total === 0
            ? "block"
            : "none";

    }
);


/* =====================================================
   UPDATE TIME
===================================================== */

setInterval(
    function(){

        renderMovies();

        renderSeries();

    },
    60000
);


/* =====================================================
   START
===================================================== */

renderMovies();

renderSeries();

</script>

</body>
</html>
